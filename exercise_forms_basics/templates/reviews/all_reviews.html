{% extends 'base.html' %}

{% block content %}
    <h1>All book reviews</h1>
    {% for review in all_reviews %}
        <p class="my-3"><a style="text-decoration: none; color: black" href="{% url 'reviews:review-details' review_id=review.id %}">Review by {{ review.author }} on {{ review.book }}</a></p>
    {% empty %}
            <h2>No reviews yet</h2>
    {% endfor %}
{% endblock %}
