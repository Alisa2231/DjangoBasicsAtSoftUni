<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <header class="navbar bg-primary navbar-dark">
        <div class="container w-75 d-flex justify-content-between">
            <div>
                <img class="me-4" height="50" width="50" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuIsFG3TUYAamA5kDo4mCTLlzjZ5_FY8hxE8H9xv2nCg&s=10"/>
                <a class="navbar-brand" href="{% url 'common:home' %}">Travel Hub</a>
            </div>

            <nav class="d-flex gap-3">
                    <a class="nav-link text-white" href="#">Travelers</a>
                    <a class="nav-link text-white me-3" href="#">Destinations</a>
            </nav>
        </div>
    </header>

    <div class="container mt-5">
        <div class="p-5 mb-4 bg-light rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">{{ welcome_message }}</h1>
                <p>Current date: {{ current_date }}</p>
                <p class="col-md-8 fs-4">This is a placeholder for your home page content. It's now styled with Bootstrap for a modern look.</p>
                <button class="btn btn-primary btn-lg" type="button">Learn More</button>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
