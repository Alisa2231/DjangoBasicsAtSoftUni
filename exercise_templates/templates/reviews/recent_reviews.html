{% extends 'books/index.html' %}

{% block content %}
    <h1>Latest book reviews</h1>
    {% for review in recent_reviews %}
        <p class="my-3"><a style="text-decoration: none; color: black" href="{% url 'review_details' review_id=review.id %}">{{ review.title }} by {{ review.author }}</a></p>
    {% empty %}
    {% endfor %}
{% endblock %}
