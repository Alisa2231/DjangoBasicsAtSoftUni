<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Notes</title>
</head>
<body>
    <h1>Asya's notes</h1>
    {% if notes %}
        <ul>
        {% for note in notes %}
            <li>{{ note.title }} - {{ note.category }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No notes yet</p>
    {% endif %}
</body>
</html>
