<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Reviews</title>
</head>
<body>
    <h1>Reviews</h1>
    {% if recent_reviews %}
        <ul>
        {% for review in recent_reviews %}
            <li>Review by {{ review.author }} named {{ review.title }}: {{ review.body }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <h3>No reviews yet.</h3>
    {% endif %}

</body>
</html>
