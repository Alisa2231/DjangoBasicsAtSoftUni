<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reviews from {{ year }} for {{ destination.name }}</title>
</head>
<body>
    <h1>Reviews from {{ year }} for {{ destination.name }}</h1>
    {% for review in reviews %}
        <li>Review by {{ review.author }} named {{ review.title }}: {{ review.body }}</li>
    {% endfor %}

</body>
</html>
